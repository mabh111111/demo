<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Package Manager</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; }
        .output { white-space: pre-wrap; background-color: #f4f4f4; border: 1px solid #ddd; padding: 10px; margin-top: 10px; max-height: 400px; overflow-y: auto; }
        .error { color: red; }
        .success { color: green; }
        input[type="text"], button { padding: 8px; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Linux Web Package Manager</h1>

        <div id="distro-info">
            <h2>Distribution Information</h2>
            <p>Loading...</p>
        </div>

        <hr>

        <div>
            <h2>Package Operations</h2>
            <input type="text" id="packageName" placeholder="Enter package name">
            <button onclick="searchPackage()">Search</button>
            <button onclick="installPackage()">Install</button>
            <button onclick="removePackage()">Remove</button>
        </div>
        
        <div>
            <h2>System Operations</h2>
            <button onclick="updateDatabase()">Update Package Database</button>
            <button onclick="listPackages()">List Installed Packages</button>
        </div>

        <h2>Output</h2>
        <div id="outputArea" class="output">
            Ready.
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
